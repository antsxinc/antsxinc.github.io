<svg width="560" height="140" viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 300;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .sub {
      font-size: 14px;
      letter-spacing: 3px;
      fill: #aaaaaa;
    }
    .ant {
      stroke: #f5e663;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
  </style>

  <!-- ANTs -->
  <text x="20" y="78" font-size="64" class="text">ANTs</text>

  <!-- X as ant -->
  <g transform="translate(300,18)">
    <!-- body -->
    <line class="ant" x1="30" y1="20" x2="30" y2="95"/>

    <!-- head -->
    <line class="ant" x1="18" y1="20" x2="42" y2="20"/>
    <line class="ant" x1="18" y1="20" x2="30" y2="5"/>
    <line class="ant" x1="42" y1="20" x2="30" y2="5"/>

    <!-- abdomen -->
    <line class="ant" x1="22" y1="95" x2="38" y2="95"/>

    <!-- legs left -->
    <line class="ant" x1="30" y1="45" x2="5" y2="35"/>
    <line class="ant" x1="30" y1="65" x2="5" y2="70"/>
    <line class="ant" x1="30" y1="85" x2="5" y2="100"/>

    <!-- legs right -->
    <line class="ant" x1="30" y1="45" x2="55" y2="35"/>
    <line class="ant" x1="30" y1="65" x2="55" y2="70"/>
    <line class="ant" x1="30" y1="85" x2="55" y2="100"/>
  </g>

  <!-- Inc -->
  <text x="22" y="115" class="sub">INC.</text>

  <!-- baseline -->
  <line x1="20" y1="90" x2="390" y2="90" stroke="#ffffff" stroke-width="1" opacity="0.18"/>
</svg>
