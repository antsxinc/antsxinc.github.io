<svg width="560" height="140" viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 300;
      letter-spacing: 2px;
      fill: #000000;
    }
    .sub {
      font-size: 14px;
      letter-spacing: 3px;
      fill: #555555;
    }
    .ant {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
  </style>

  <!-- ANTs -->
  <text x="20" y="78" font-size="64" class="text">ANTs</text>

  <!-- Nazca-style Ant (replacing X) -->
  <g transform="translate(255,35) scale(1)">
    <!-- body -->
    <line class="ant" x1="40" y1="10" x2="40" y2="70"/>
    <line class="ant" x1="40" y1="70" x2="40" y2="110"/>

    <!-- head -->
    <line class="ant" x1="25" y1="10" x2="55" y2="10"/>
    <line class="ant" x1="25" y1="10" x2="40" y2="0"/>
    <line class="ant" x1="55" y1="10" x2="40" y2="0"/>

    <!-- legs left -->
    <line class="ant" x1="40" y1="40" x2="15" y2="30"/>
    <line class="ant" x1="40" y1="60" x2="15" y2="65"/>
    <line class="ant" x1="40" y1="85" x2="15" y2="100"/>

    <!-- legs right -->
    <line class="ant" x1="40" y1="40" x2="65" y2="30"/>
    <line class="ant" x1="40" y1="60" x2="65" y2="65"/>
    <line class="ant" x1="40" y1="85" x2="65" y2="100"/>
  </g>

  <!-- Inc -->
  <text x="22" y="115" class="sub">INC.</text>

  <!-- Grounding line -->
  <line x1="20" y1="90" x2="360" y2="90" stroke="#000000" stroke-width="1" opacity="0.15"/>
</svg>
