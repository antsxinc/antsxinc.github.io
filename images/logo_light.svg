<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <g transform="translate(20, 25)">
    <!-- Lines (Black) -->
    <line x1="10" y1="10" x2="90" y2="90" stroke="#000000" stroke-width="8" stroke-linecap="round" />
    <line x1="90" y1="10" x2="10" y2="90" stroke="#000000" stroke-width="8" stroke-linecap="round" />
    <line x1="50" y1="50" x2="50" y2="10" stroke="#000000" stroke-width="4" stroke-opacity="0.5" />
    <line x1="50" y1="50" x2="10" y2="50" stroke="#000000" stroke-width="4" stroke-opacity="0.5" />
    <line x1="50" y1="50" x2="90" y2="50" stroke="#000000" stroke-width="4" stroke-opacity="0.5" />
    <!-- Nodes (Black) -->
    <circle cx="10" cy="10" r="8" fill="#000000" />
    <circle cx="90" cy="10" r="8" fill="#000000" />
    <circle cx="10" cy="90" r="8" fill="#000000" />
    <circle cx="90" cy="90" r="8" fill="#000000" />
    <!-- Center Node (Deep Teal for Light Theme) -->
    <circle cx="50" cy="50" r="10" fill="#00796B" stroke="#000000" stroke-width="3" />
  </g>
  <!-- Text (Black) -->
  <text x="130" y="85" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="80" letter-spacing="-2" fill="#000000">ANTsX</text>
  <!-- Subtext (Grey) -->
  <text x="390" y="85" font-family="Helvetica, Arial, sans-serif" font-weight="300" font-size="80" fill="#666666">Inc.</text>
</svg>